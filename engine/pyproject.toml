[project]
name = "jevsort-engine"
version = "0.1.0"
description = "Local System One folder-decision engine for jev-folder-sort"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "torch>=2.4",
    "tokenizers>=0.20",
    "huggingface_hub>=0.25",
    "safetensors>=0.4",
    "numpy>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevsort_engine", "datasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
